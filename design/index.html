<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World Acceptance 5</title>
  <style>
    :root {
      --background: #FFFFFF;
      --text: #000000;
      --accent: #2563EB;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 560px);
    }

    section {
      text-align: center;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(40px, 8vw, 72px);
      line-height: 1.05;
      font-weight: 700;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    form {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: stretch;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--text);
      border-radius: 0;
      background: var(--background);
      color: var(--text);
      font: inherit;
      font-size: 18px;
    }

    button {
      height: 48px;
      padding: 0 22px;
      border: 1px solid var(--accent);
      border-radius: 0;
      background: var(--accent);
      color: var(--background);
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    @media (max-width: 520px) {
      body {
        padding: 20px;
      }

      form {
        flex-direction: column;
      }

      input,
      button {
        width: 100%;
      }

      input {
        flex: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section aria-labelledby="greeting-heading">
      <h1 id="greeting-heading">Hello, World!</h1>
      <form id="greeting-form">
        <label for="greeting-input">Greeting</label>
        <input id="greeting-input" name="greeting" type="text" value="Hello, World!" autocomplete="off" required>
        <button type="submit">Save</button>
      </form>
    </section>
  </main>
  <script>
    const form = document.getElementById('greeting-form');
    const input = document.getElementById('greeting-input');
    const heading = document.getElementById('greeting-heading');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const nextGreeting = input.value.trim();
      if (!nextGreeting) {
        input.focus();
        return;
      }
      heading.textContent = nextGreeting;
      input.value = nextGreeting;
    });
  </script>
</body>
</html>
